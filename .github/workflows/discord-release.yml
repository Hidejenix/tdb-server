
name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Publish update to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}

        run: |
          node <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL;

          if (!webhook) {
            throw new Error("DISCORD_RELEASE_WEBHOOK is missing");
          }

          function cleanDescription(text) {
            if (!text) {
              return "Описание обновления отсутствует.";
            }

            let lines = text.split(/\r?\n/);
            let result = [];
            let skipNextValue = false;
            let skipDownloads = false;

            for (let line of lines) {
              const trimmed = line.trim();

              // Если начался блок Downloads — удаляем его целиком
              if (/^\*{0,2}\s*Downloads\s*:?\s*\*{0,2}\s*$/i.test(trimmed)) {
                skipDownloads = true;
                continue;
              }

              if (skipDownloads) {
                continue;
              }

              // Удаляем заголовки Version, Author, Release type
              if (
                /^\*{0,2}\s*(Version|Author|Release\s*type)\s*:?\s*\*{0,2}\s*$/i.test(trimmed)
              ) {
                skipNextValue = true;
                continue;
              }

              // Удаляем значение соответствующего поля
              if (skipNextValue) {
                if (trimmed === "") {
                  continue;
                }

                skipNextValue = false;
                continue;
              }

              // Удаляем ссылки Markdown и их содержимое
              if (
                /^\[?.*\]?\(https?:\/\/.*\)\s*$/i.test(trimmed) ||
                /^https?:\/\/\S+/i.test(trimmed)
              ) {
                continue;
              }

              // Удаляем оставшиеся URL
              line = line.replace(/https?:\/\/\S+/g, "").trim();

              result.push(line);
            }

            return result
              .join("\n")
              .replace(/\n{3,}/g, "\n\n")
              .trim() || "Описание обновления отсутствует.";
          }

          const title = (
            process.env.RELEASE_NAME || "Новое обновление"
          ).trim();

          const description = cleanDescription(
            process.env.RELEASE_BODY
          );

          const payload = {
            embeds: [{
              title: title.slice(0, 256),
              description: description.slice(0, 4000),
              color: 0xC49A45
            }],
            allowed_mentions: {
              parse: []
            }
          };

          const response = await fetch(webhook, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(
              `Discord error ${response.status}: ${await response.text()}`
            );
          }

          console.log("Release announcement successfully sent!");
          NODE
