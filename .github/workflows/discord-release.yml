
name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          node <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL;

          if (!webhook) {
            throw new Error("DISCORD_RELEASE_WEBHOOK is missing");
          }

          const clean = (text) => text
            .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, "$1")
            .replace(/https?:\/\/\S+/g, "")
            .replace(/<https?:\/\/[^>]+>/g, "")
            .trim();

          const title = clean(process.env.RELEASE_NAME || "Новое обновление");
          const description = clean(process.env.RELEASE_BODY || "Описание обновления пока не добавлено.");

          const response = await fetch(webhook, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: "The Day After",
              embeds: [{
                title: title.slice(0, 256),
                description: description.slice(0, 4000),
                color: 0xC49A45
              }],
              allowed_mentions: { parse: [] }
            })
          });

          if (!response.ok) {
            throw new Error(`Discord error: ${response.status}`);
          }
          NODE
