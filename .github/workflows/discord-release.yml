name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Publish update to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}

        run: |
          node <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL;

          if (!webhook) {
            throw new Error("DISCORD_RELEASE_WEBHOOK is missing");
          }

          function cleanDescription(text) {
            if (!text) {
              return "Описание обновления отсутствует.";
            }

            // Удаляем ВСЁ начиная с технического блока Version
            // включая Author, Release type, Downloads и ссылки на файлы.
            const technicalBlock = /^\s*\*\*\s*Version\s*\*\*[\s\S]*$/im;

            let description = text.replace(technicalBlock, "");

            // Удаляем случайные ссылки, если они остались в описании
            description = description
              .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, "$1")
              .replace(/https?:\/\/\S+/g, "");

            return description
              .replace(/\n{3,}/g, "\n\n")
              .trim() || "Описание обновления отсутствует.";
          }

          const title = (
            process.env.RELEASE_NAME || "Новое обновление"
          ).trim();

          const description = cleanDescription(
            process.env.RELEASE_BODY
          );

          // Используем оригинальное имя и аватар Discord Webhook.
          // Не добавляем дополнительные поля, ссылки и футер.

          const payload = {
            embeds: [
              {
                title: title.slice(0, 256),
                description: description.slice(0, 4000),
                color: 0xC49A45
              }
            ],
            allowed_mentions: {
              parse: []
            }
          };

          const response = await fetch(webhook, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const error = await response.text();

            throw new Error(
              `Discord error ${response.status}: ${error}`
            );
          }

          console.log(
            "The Day After release successfully published to Discord!"
          );
          NODE
