
name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Publish update to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}

        run: |
          node <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL;

          if (!webhook) {
            throw new Error("DISCORD_RELEASE_WEBHOOK is missing");
          }

          function cleanDescription(text) {
            if (!text) {
              return "Описание обновления отсутствует.";
            }

            const lines = text.split(/\r?\n/);
            const result = [];

            let skipNextValue = false;
            let skipDownloads = false;

            for (const line of lines) {
              const trimmed = line.trim();

              // Удаляем весь блок Downloads и всё после него
              if (/^\*{0,2}\s*Downloads\s*:?\s*\*{0,2}\s*$/i.test(trimmed)) {
                skipDownloads = true;
                continue;
              }

              if (skipDownloads) {
                continue;
              }

              // Удаляем техническую подпись релиза
              if (/^\*{0,2}\s*THE DAY AFTER\s*•\s*RELEASES.*$/i.test(trimmed)) {
                continue;
              }

              // Удаляем Version, Author и Release type
              const metadata = trimmed.match(
                /^\*{0,2}\s*(Version|Author|Release\s*type)\s*\*{0,2}\s*:?\s*(.*)$/i
              );

              if (metadata) {
                const inlineValue = metadata[2].trim();

                // Если значение находится на следующей строке,
                // пропускаем её тоже
                skipNextValue = !inlineValue;
                continue;
              }

              // Пропускаем значение технического поля
              if (skipNextValue) {
                skipNextValue = false;
                continue;
              }

              // Удаляем любые оставшиеся URL и Markdown-ссылки
              let cleaned = line
                .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, "")
                .replace(/https?:\/\/\S+/g, "")
                .trim();

              if (cleaned) {
                result.push(cleaned);
              } else {
                result.push("");
              }
            }

            return result
              .join("\n")
              .replace(/\n{3,}/g, "\n\n")
              .trim() || "Описание обновления отсутствует.";
          }

          const title = (
            process.env.RELEASE_NAME || "Новое обновление"
          ).trim();

          const description = cleanDescription(
            process.env.RELEASE_BODY
          );

          // Не передаём username, avatar_url или footer:
          // Discord сохранит оригинальное имя и аватар Webhook.

          const payload = {
            embeds: [{
              title: title.slice(0, 256),
              description: description.slice(0, 4000),
              color: 0xC49A45
            }],
            allowed_mentions: {
              parse: []
            }
          };

          const response = await fetch(webhook, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(
              `Discord error ${response.status}: ${await response.text()}`
            );
          }

          console.log("Release announcement successfully sent!");
          NODE
